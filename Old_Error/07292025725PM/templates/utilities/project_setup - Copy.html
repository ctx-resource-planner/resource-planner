{% extends "base.html" %}
{% block title %}Project Setup Form{% endblock %}

{% block content %}
<style>
    .form-control, .form-select {
        background-color: #fff;
        border: 1px solid #ced4da;
        border-radius: 0.25rem;
        padding: 0.375rem 0.75rem;
    }
    .form-control:focus, .form-select:focus {
        border-color: #86b7fe;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }
    .required-field::after {
        content: " *";
        color: #dc3545;
    }
    .card {
        margin-bottom: 1.5rem;
        border: 1px solid rgba(0,0,0,.125);
        border-radius: 0.5rem;
    }
    .card-header {
        padding: 0.75rem 1.25rem;
        background-color: #f8f9fa;
        border-bottom: 1px solid rgba(0,0,0,.125);
    }
    .card-body {
        padding: 1.25rem;
    }
    .bg-info {
        background-color: #0dcaf0 !important;
    }
    .btn-sm {
        padding: 0.25rem 0.5rem;
        font-size: 0.875rem;
    }
    .btn i {
        margin-right: 0.25rem;
    }
</style>

<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-project-diagram"></i> Project Set-Up Form</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('utilities.project_setup') }}" id="projectSetupForm" enctype="multipart/form-data">
                       
                        <!-- Section A: Project & Customer Details -->
                        <div class="card mb-4">
                            <div class="card-header bg-info text-white">
                                <h5 class="mb-0">Section A. Project & Customer Details</h5>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label required-field">Customer Name</label>
                                            <select class="form-select" name="customer_name" required>
                                                <option value="">Select Customer</option>
                                                {% for customer in customers %}
                                                <option value="{{ customer.customer_name }}"
                                                    {% if form_data.customer_name == customer.customer_name %}selected{% endif %}>
                                                    {{ customer.customer_name }}
                                                </option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Customer Abbreviation</label>
                                            <input type="text" class="form-control" name="customer_abbreviation" 
                                                   value="{{ form_data.get('customer_abbreviation', '') }}">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label required-field">Project Name</label>
                                            <input type="text" class="form-control" name="project_name_quickbooks" 
                                                   value="{{ form_data.get('project_name_quickbooks', '') }}" required>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Customer Address</label>
                                            <textarea class="form-control" name="customer_address" rows="2">{{ form_data.get('customer_address', '') }}</textarea>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label">PO Number</label>
                                            <input type="text" class="form-control" name="customer_po_number"
                                                   value="{{ form_data.get('customer_po_number', '') }}">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Project Type</label>
                                            <select class="form-select" name="project_type">
                                                <option value="">Select Type</option>
                                                {% for type in ['Fixed Price', 'Time & Materials', 'Managed Service'] %}
                                                <option value="{{ type }}"
                                                    {% if form_data.get('project_type') == type %}selected{% endif %}>
                                                    {{ type }}
                                                </option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label required-field">Business Unit</label>
                                            <select class="form-select" name="business_unit_id" required>
                                                <option value="">Select Business Unit</option>
                                                {% for bu in business_units %}
                                                <option value="{{ bu.id }}" 
                                                    {% if form_data.business_unit_id == bu.id|string %}selected{% endif %}>
                                                    {{ bu.name }} ({{ bu.short_name }})
                                                </option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                        <div class="row">
                                            <div class="col-md-6">
                                                <div class="mb-3">
                                                    <label class="form-label">Start Date</label>
                                                    <input type="date" class="form-control" name="project_start_date"
                                                           value="{{ form_data.get('project_start_date', '') }}">
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="mb-3">
                                                    <label class="form-label">End Date</label>
                                                    <input type="date" class="form-control" name="estimated_end_date"
                                                           value="{{ form_data.get('estimated_end_date', '') }}">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Section B: Employee/Contractor Details -->
                        <div class="card mb-4">
                            <div class="card-header bg-info text-white">
                                <h5 class="mb-0">Section B. Employee/Contractor Details</h5>
                            </div>
                            <div class="card-body">
                                <div id="employeeSection">
                                    <div class="employee-row row mb-3">
                                        <div class="col-md-3">
                                            <label class="form-label">Employee/Contractor</label>
                                            <select class="form-select employee-select" name="employee_name[]">
                                                <option value="">Select Employee</option>
                                                {% for emp in employees %}
                                                <option value="{{ emp.email }}">{{ emp.name }} ({{ emp.email }})</option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                        <div class="col-md-2">
                                            <label class="form-label">Location</label>
                                            <select class="form-select" name="onshore_offshore[]">
                                                <option value="">Select</option>
                                                <option value="Onshore">Onshore</option>
                                                <option value="Offshore">Offshore</option>
                                            </select>
                                        </div>
                                        <div class="col-md-3">
                                            <label class="form-label">Tsheet Service</label>
                                            <input type="text" class="form-control" name="tsheet_service_name[]">
                                        </div>
                                        <div class="col-md-2">
                                            <label class="form-label">Bill Rate/Hr</label>
                                            <input type="number" class="form-control" name="bill_rate[]" step="0.01">
                                        </div>
                                        <div class="col-md-1">
                                            <label class="form-label">Cost Rate</label>
                                            <input type="number" class="form-control" name="cost_rate[]" step="0.01">
                                        </div>
                                        <div class="col-md-1 d-flex align-items-end">
                                            <button type="button" class="btn btn-danger btn-sm remove-employee" style="display:none;">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-success btn-sm" id="addEmployee">
                                    <i class="fas fa-plus"></i> Add Employee
                                </button>
                            </div>
                        </div>

                        <!-- Section C: Fixed Price Details -->
                        <div class="card mb-4">
                            <div class="card-header bg-info text-white">
                                <h5 class="mb-0">Section C. Fixed Price Details</h5>
                            </div>
                            <div class="card-body">
                                <div id="fixedPriceSection">
                                    <div class="fp-row row mb-3">
                                        <div class="col-md-9">
                                            <label class="form-label">Description</label>
                                            <input type="text" class="form-control" name="fp_description[]">
                                        </div>
                                        <div class="col-md-2">
                                            <label class="form-label">Amount</label>
                                            <input type="number" class="form-control" name="fp_amount[]" step="0.01">
                                        </div>
                                        <div class="col-md-1 d-flex align-items-end">
                                            <button type="button" class="btn btn-danger btn-sm remove-fp" style="display:none;">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-success btn-sm" id="addFixedPrice">
                                    <i class="fas fa-plus"></i> Add Fixed Price Item
                                </button>
                            </div>
                        </div>

                        <!-- Email Notification -->
                        <div class="card mb-4">
                            <div class="card-header bg-warning">
                                <h5 class="mb-0">Email Notification</h5>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label">Email Recipients (comma separated)</label>
                                    <input type="text" class="form-control" name="email_recipients" 
                                           value="{{ form_data.get('email_recipients', '') }}"
                                           placeholder="email1@example.com, email2@example.com">
                                </div>
                            </div>
                        </div>

                        <!-- Form Actions -->
                        <div class="d-flex justify-content-between mt-4">
						<button type="button" class="btn btn-secondary" onclick="window.history.back()">
							<i class="fas fa-arrow-left"></i> Back
						</button>
						<div>
							<button type="submit" name="action" value="submit" class="btn btn-primary">
								<i class="fas fa-paper-plane"></i> Submit
							</button>
						</div>
					</div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Add Employee Row
    document.getElementById('addEmployee')?.addEventListener('click', function() {
        const section = document.getElementById('employeeSection');
        const newRow = section.querySelector('.employee-row').cloneNode(true);
        newRow.querySelectorAll('input, select').forEach(input => input.value = '');
        section.appendChild(newRow);
        updateRemoveButtons();
    });

    // Add Fixed Price Row
    document.getElementById('addFixedPrice')?.addEventListener('click', function() {
        const section = document.getElementById('fixedPriceSection');
        const newRow = section.querySelector('.fp-row').cloneNode(true);
        newRow.querySelectorAll('input').forEach(input => input.value = '');
        section.appendChild(newRow);
        updateRemoveButtons();
    });

    // Remove row functionality
    document.addEventListener('click', function(e) {
        if (e.target.closest('.remove-employee')) {
            const row = e.target.closest('.employee-row');
            if (document.querySelectorAll('.employee-row').length > 1) {
                row.remove();
                updateRemoveButtons();
            }
        }
        if (e.target.closest('.remove-fp')) {
            const row = e.target.closest('.fp-row');
            if (document.querySelectorAll('.fp-row').length > 1) {
                row.remove();
                updateRemoveButtons();
            }
        }
    });

    function updateRemoveButtons() {
        // Update employee remove buttons
        document.querySelectorAll('.employee-row').forEach((row, index, rows) => {
            const removeBtn = row.querySelector('.remove-employee');
            if (removeBtn) removeBtn.style.display = rows.length > 1 ? 'inline-block' : 'none';
        });

        // Update fixed price remove buttons
        document.querySelectorAll('.fp-row').forEach((row, index, rows) => {
            const removeBtn = row.querySelector('.remove-fp');
            if (removeBtn) removeBtn.style.display = rows.length > 1 ? 'inline-block' : 'none';
        });
    }

    // Initialize remove buttons
    updateRemoveButtons();
});
</script>
{% endblock %}
