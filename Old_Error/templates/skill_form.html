{% extends 'base.html' %}

{% block title %}{{ action }} Skill{% endblock %}

{% block content %}
 <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header">
                 <i class="fas fa-{% if action == 'Add' %}plus{% else %}edit{% endif %} me-2"></i> {{ action }} Skill
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label">Skill Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ skill.name if skill else '' }}" required autofocus>
                    </div>
                     <div class="d-flex justify-content-end"> <!-- Align buttons right -->
                        <a href="{{ url_for('skills_list') }}" class="btn btn-secondary me-2"><i class="fas fa-times me-1"></i> Cancel</a>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> {{ action }} Skill</button>
                    </div>
                </form>
            </div> <!-- /card-body -->
        </div> <!-- /card -->
    </div> <!-- /col -->
 </div> <!-- /row -->
{% endblock %}
